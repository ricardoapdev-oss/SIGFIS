<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M50 5 L86 20 L86 54 C86 76 68 91 50 97 C32 91 14 76 14 54 L14 20 Z"
    fill="url(#shieldGrad)" />

  <!-- Shield inner highlight (top edge) -->
  <path d="M50 11 L80 24 L80 54 C80 72 64 85 50 91"
    fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Document body -->
  <rect x="30" y="22" width="30" height="40" rx="3" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- Document corner fold -->
  <path d="M51 22 L60 31 L51 31 Z" fill="rgba(255,255,255,0.22)"/>
  <path d="M51 22 L60 31" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Document text lines -->
  <rect x="34" y="37" width="14" height="2.5" rx="1.25" fill="white" fill-opacity="0.9"/>
  <rect x="34" y="43" width="19" height="2.5" rx="1.25" fill="white" fill-opacity="0.72"/>
  <rect x="34" y="49" width="10" height="2.5" rx="1.25" fill="white" fill-opacity="0.55"/>

  <!-- Magnifier glass (emerald accent) -->
  <circle cx="64" cy="70" r="11.5" fill="none" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
  <circle cx="64" cy="70" r="5.5" fill="#34d399" fill-opacity="0.28"/>
  <!-- Magnifier cross-hairs / inner detail -->
  <line x1="64" y1="65" x2="64" y2="75" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="59" y1="70" x2="69" y2="70" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
  <!-- Handle -->
  <line x1="72" y1="78" x2="80" y2="86" stroke="#34d399" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
</svg>
