version: "3.8"

# ══════════════════════════════════════════════════════════════════════
#  SIGECONTRATOS — Stack completa
#  Acesso na rede local: http://<IP-DO-SERVIDOR>:3000
#  pgAdmin (banco de dados):  http://<IP-DO-SERVIDOR>:5050
# ══════════════════════════════════════════════════════════════════════

services:

  # ── Banco de Dados PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sigecontratos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigecontratos_user
      POSTGRES_PASSWORD: sigecontratos_password
      POSTGRES_DB: sigecontratos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigecontratos_user -d sigecontratos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API Backend (NestJS) ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigecontratos_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://sigecontratos_user:sigecontratos_password@postgres:5432/sigecontratos_db
      JWT_SECRET: ${JWT_SECRET:-sigecontratos_jwt_troque_em_producao_2026}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Next.js) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigecontratos_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # BACKEND_URL é lido pelo servidor Next.js em runtime para reescrever
      # as chamadas /api/* para o container backend (rede interna Docker).
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend

  # ── pgAdmin (interface visual do banco) ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sigecontratos_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@iquego.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_iquego_2026}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
